description: >-
  Archrock publishes no API plans or API pricing of any kind. Archrock is a natural gas
  compression services company (NYSE: AROC); it sells contract compression, aftermarket
  services and equipment, not API access. There is no developer portal, no signup, no
  pricing page for a programmatic product, and no "contact us for API access" motion.
  plan_count is 0 as a measured fact, not as a gap in our search.
plans: []
note: >-
  CORRECTED 2026-09-04. This file previously carried three fabricated tiers — "archrock-free"
  (1,000 requests/month), "archrock-pro" (100,000 requests/month) and "archrock-enterprise" —
  written by the 2026-05-04 bulk scaffold sweep and self-labelled in its own description as
  "scaffold defaults". Those tiers were never published by Archrock and do not exist. They
  fed the scored plans[].plan_count field, crediting Archrock with a commercial API program
  it has never operated. Replaced with the measured zero.
