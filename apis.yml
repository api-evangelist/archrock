apis:
- aid: archrock:sec-edgar-filings
  name: SEC EDGAR Filings (Archrock, Inc., CIK 1389050)
  description: >-
    Machine-readable filing data for Archrock is available from the U.S. Securities and
    Exchange Commission, not from the company. The SEC EDGAR submissions API returns the full
    filing history for CIK 0001389050 (Archrock, Inc., NYSE: AROC; formerly Exterran Holdings)
    as JSON. This is a third-party government API listed here because it is the only real
    programmatic access to this company's data. Archrock itself publishes no API.
  humanURL: https://www.sec.gov/search-filings/edgar-application-programming-interfaces
  tags:
  - Filings
  - SEC EDGAR
  - Third Party
  properties:
  - type: Documentation
    url: https://www.sec.gov/search-filings/edgar-application-programming-interfaces
  - type: APIReference
    url: https://data.sec.gov/submissions/CIK0001389050.json
  x-evidence:
    verified: '2026-09-26'
    method: fetched documentation and called the endpoint
    documentation: The SEC's EDGAR APIs page (HTTP 200) documents RESTful JSON APIs on data.sec.gov,
      including https://data.sec.gov/submissions/CIK##########.json. No API key; a declared
      User-Agent is required.
    endpoint_check: GET https://data.sec.gov/submissions/CIK0001389050.json returned HTTP 200
      application/json naming "Archrock, Inc.", ticker AROC on NYSE, former name EXTERRAN HOLDINGS
      INC., latest filing an 8-K dated 2026-08-11. The CIK comes from sec.gov/files/company_tickers.json
      (AROC -> 1389050).
