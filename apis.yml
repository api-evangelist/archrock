x-fabrication:
  found: '2026-09-26'
  issue: https://github.com/api-evangelist/roadmap/issues/725
  finding: >-
    The four APIs this record listed (Financials, Fleet, Operations, SEC Filings) were split from
    openapi/archrock-investor-relations-api.yaml, an OpenAPI written by the 2026-05-04 API Evangelist
    bulk scaffold pass, not published by Archrock. Its only server, https://api.archrock.com/v1,
    has no DNS record (NXDOMAIN, re-checked 2026-09-26), Archrock's 41-URL sitemap has no developer,
    API or docs page, and the scaffold's own derived artifacts already said "SCAFFOLD-DERIVED, NOT
    PUBLISHED". The spec and everything derived from it (collections, examples, JSON Schema, JSON
    Structure, JSON-LD, Spectral rules, vocabulary, capability edges, agentic-access, authentication)
    were moved to _fabricated/ and the apis entries replaced with the SEC EDGAR submissions API,
    labelled as third-party.
